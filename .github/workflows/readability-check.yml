name: Readability Check

on:
  pull_request:
    types: [opened, edited, synchronize]
    paths:
      - '**.md'
      - '**.txt'
  issues:
    types: [opened, edited]

jobs:
  analyze-readability:
    name: Analyze text readability
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyze PR body readability
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const body = context.payload.pull_request.body || '';
            if (!body.trim()) { console.log('No PR body to analyze.'); return; }
            fs.writeFileSync('/tmp/input.txt', body);
            const result = execSync('node scripts/analyze.mjs /tmp/input.txt', { encoding: 'utf8' });
            const a = JSON.parse(result);
            const lv = a.level;
            const levelEmoji = { A1: '🟢', A2: '🟢', B1: '🟡', B2: '🟠', C1: '🔴', C2: '🔴' };
            const overallEmoji = a.overallScore >= 70 ? '🟢' : a.overallScore >= 40 ? '🟡' : '🔴';
            let comment = `## ${overallEmoji} Text Barrier Detector — Readability Report\n\n`;
            comment += `### ${levelEmoji[lv.level]} Text Level: \`${lv.level}\` — ${lv.label}\n`;
            comment += `> ${lv.description}\n> **Recommended audience:** ${lv.audience}\n\n`;
            comment += `| Metric | Value |\n|--------|-------|\n`;
            comment += `| Overall Score | **${a.overallScore}/100** |\n`;
            comment += `| Level Score | ${lv.score}/100 |\n`;
            comment += `| Flesch Reading Ease | ${a.fleschScore} (${a.fleschLabel}) |\n`;
            comment += `| Grade Level | ${a.gradeLevel} |\n`;
            comment += `| Avg Sentence Length | ${a.avgSentenceLength} words |\n`;
            comment += `| Passive Voice Sentences | ${a.passiveCount} |\n`;
            comment += `| Complex Words | ${a.complexWordCount} |\n`;
            comment += `| Structure Score | ${a.structureScore}/100 |\n\n`;
            const d = lv.dimensions;
            comment += `### 📊 Dimension Breakdown\n| Dimension | Score |\n|-----------|-------|\n`;
            comment += `| Readability (Flesch) | ${Math.round(d.readabilityScore)}/100 |\n`;
            comment += `| Sentence Length | ${Math.round(d.sentenceLengthScore)}/100 |\n`;
            comment += `| Passive Voice | ${Math.round(d.passiveVoiceScore)}/100 |\n`;
            comment += `| Complexity | ${Math.round(d.complexityScore)}/100 |\n`;
            comment += `| Structure | ${Math.round(d.structureScore)}/100 |\n\n`;
            if (lv.tips && lv.tips.length > 0) {
              const next = { C2: 'C1', C1: 'B2', B2: 'B1', B1: 'A2', A2: 'A1', A1: null }[lv.level];
              if (next) comment += `### 🎯 Tips to reach level ${next}\n`;
              lv.tips.forEach(t => { comment += `- ${t}\n`; });
              comment += '\n';
            }
            comment += `> Powered by [Text Barrier Detector](https://prose-decoder-bot.vercel.app)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body: comment
            });
            if (a.overallScore < 30) core.setFailed(`Readability score too low (${a.overallScore}/100). Level: ${lv.level} — ${lv.label}.`);

      - name: Analyze Issue body readability
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            if (!body.trim()) { console.log('No issue body to analyze.'); return; }
            fs.writeFileSync('/tmp/input.txt', body);
            const result = execSync('node scripts/analyze.mjs /tmp/input.txt', { encoding: 'utf8' });
            const a = JSON.parse(result);
            const lv = a.level;
            const levelEmoji = { A1: '🟢', A2: '🟢', B1: '🟡', B2: '🟠', C1: '🔴', C2: '🔴' };
            const overallEmoji = a.overallScore >= 70 ? '🟢' : a.overallScore >= 40 ? '🟡' : '🔴';
            let comment = `## ${overallEmoji} Text Barrier Detector — Readability Report\n\n`;
            comment += `### ${levelEmoji[lv.level]} Text Level: \`${lv.level}\` — ${lv.label}\n`;
            comment += `> ${lv.description}\n> **Recommended audience:** ${lv.audience}\n\n`;
            comment += `| Metric | Value |\n|--------|-------|\n`;
            comment += `| Overall Score | **${a.overallScore}/100** |\n`;
            comment += `| Level Score | ${lv.score}/100 |\n`;
            comment += `| Flesch Reading Ease | ${a.fleschScore} (${a.fleschLabel}) |\n`;
            comment += `| Grade Level | ${a.gradeLevel} |\n`;
            comment += `| Avg Sentence Length | ${a.avgSentenceLength} words |\n`;
            comment += `| Passive Voice Sentences | ${a.passiveCount} |\n`;
            comment += `| Complex Words | ${a.complexWordCount} |\n\n`;
            const d = lv.dimensions;
            comment += `### 📊 Dimension Breakdown\n| Dimension | Score |\n|-----------|-------|\n`;
            comment += `| Readability (Flesch) | ${Math.round(d.readabilityScore)}/100 |\n`;
            comment += `| Sentence Length | ${Math.round(d.sentenceLengthScore)}/100 |\n`;
            comment += `| Passive Voice | ${Math.round(d.passiveVoiceScore)}/100 |\n`;
            comment += `| Complexity | ${Math.round(d.complexityScore)}/100 |\n`;
            comment += `| Structure | ${Math.round(d.structureScore)}/100 |\n\n`;
            if (lv.tips && lv.tips.length > 0) {
              const next = { C2: 'C1', C1: 'B2', B2: 'B1', B1: 'A2', A2: 'A1', A1: null }[lv.level];
              if (next) comment += `### 🎯 Tips to reach level ${next}\n`;
              lv.tips.forEach(t => { comment += `- ${t}\n`; });
              comment += '\n';
            }
            comment += `> Powered by [Text Barrier Detector](https://prose-decoder-bot.vercel.app)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number, body: comment
            });
